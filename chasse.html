<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>La caccia di Ugo</title>
<meta name="theme-color" content="#FAF3E0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17131A" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="chasse.webmanifest">
<link rel="apple-touch-icon" href="icons/chasse-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Caccia di Ugo">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* Layout : app mobile. Mappa disegnata come home, una tappa alla volta, bottone d'azione nella zona del pollice,
   barra delle schede in basso. Punti = foglie di tè che riempiono una tazza, timbri da passaporto. */
:root{
  --bg:#FAF3E0; --surface:#FFFDF8; --surface2:#F3EAD3; --ink:#1F1A17; --muted:#6B6157; --line:#E8DCC2;
  --accent:#D6457F; --accent-ink:#FFFFFF; --blush:#FBC9DC; --gold:#D99A1E; --leaf:#5E9A4F; --tea:#C98A3A;
  --ok:#3F8A43; --okbg:#DDEFD6; --ko:#C2413A; --kobg:#F8DAD5; --river:#CFE0F1; --paper:#FFF8E8; --shadow:rgba(80,50,20,.18);
  --d1:#F386AE; --d2:#9C87BC; --d3:#6F98C8; --d4:#7FA477;
  --display:"Fraunces", Georgia, "Times New Roman", serif;
  --body:"Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  --tab:64px; --sb:env(safe-area-inset-bottom,0px); --st:env(safe-area-inset-top,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#17131A; --surface:#221C24; --surface2:#2C2530; --ink:#F6EEE6; --muted:#B3A79F; --line:#3A3140;
  --accent:#F386AE; --accent-ink:#1A1016; --blush:#4A2A3A; --gold:#F0C766; --leaf:#8CCB7E; --tea:#E0A85A;
  --ok:#8CCB86; --okbg:#21362A; --ko:#F08A80; --kobg:#3E2226; --river:#2B3A4C; --paper:#241E26; --shadow:rgba(0,0,0,.5);
  --d1:#F59BBE; --d2:#B6A3D6; --d3:#8DB2DD; --d4:#9CC293; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17131A; --surface:#221C24; --surface2:#2C2530; --ink:#F6EEE6; --muted:#B3A79F; --line:#3A3140;
  --accent:#F386AE; --accent-ink:#1A1016; --blush:#4A2A3A; --gold:#F0C766; --leaf:#8CCB7E; --tea:#E0A85A;
  --ok:#8CCB86; --okbg:#21362A; --ko:#F08A80; --kobg:#3E2226; --river:#2B3A4C; --paper:#241E26; --shadow:rgba(0,0,0,.5);
  --d1:#F59BBE; --d2:#B6A3D6; --d3:#8DB2DD; --d4:#9CC293; color-scheme:dark}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;
  padding-top:var(--st);-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
h1,h2,h3{font-family:var(--display);font-weight:600;line-height:1.1;margin:0;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
button:focus-visible,a:focus-visible,g[data-act]:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:12px}
svg.i{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* Barra in alto */
.top{position:sticky;top:var(--st);z-index:10;background:color-mix(in srgb,var(--bg) 88%,transparent);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);padding:10px 16px 8px;display:grid;gap:8px}
.top .bar{display:flex;align-items:center;justify-content:space-between;gap:10px}
.top .title{font-family:var(--display);font-weight:700;font-size:1.15rem;display:flex;align-items:baseline;gap:8px;min-width:0}
.top .title small{font-family:var(--body);font-size:.78rem;font-weight:700;color:var(--muted)}
.leaves{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;
  padding:5px 12px 5px 6px;font-weight:800;font-variant-numeric:tabular-nums;font-size:.95rem}
.leaves .lf{width:24px;height:24px;border-radius:50%;background:var(--leaf);display:grid;place-items:center}
.leaves .lf svg{width:15px;height:15px;color:#fff;stroke-width:2.2}
.leaves.bump{animation:bump .5s ease}
.seg{display:grid;grid-template-columns:repeat(16,1fr);gap:3px}
.seg i{height:5px;border-radius:3px;background:var(--line)}
.seg i.done{background:var(--c)}
.seg i.skip{background:color-mix(in srgb,var(--c) 30%,var(--line))}
.seg i.here{background:var(--ink)}

main{padding:6px 16px calc(var(--tab) + var(--sb) + 104px);max-width:560px;margin:0 auto}

/* Mappa */
.maphead{display:grid;gap:4px;padding:8px 2px 12px}
.maphead h1{font-size:2.1rem;color:var(--accent)}
.maphead h1 em{font-weight:400;color:var(--ink)}
.maphead p{color:var(--muted);font-weight:600;font-size:.92rem}
.map{background:var(--paper);border:1px solid var(--line);border-radius:26px;overflow:hidden;box-shadow:0 18px 40px -30px var(--shadow)}
.map svg{display:block;width:100%;height:auto}
.map text{font-family:var(--body);fill:var(--muted)}
.map .lab{font-family:var(--display);font-weight:600;fill:var(--ink);font-size:15px;paint-order:stroke;stroke:var(--paper);stroke-width:4px;stroke-linejoin:round}
.map g[data-act]{cursor:pointer}
.map .pulse{animation:pulse 1.6s ease-out infinite;transform-box:fill-box;transform-origin:center}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;padding:10px 14px 14px;font-size:.78rem;font-weight:700;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:50%;display:inline-block}

/* Tazza e timbri */
.sect{margin-top:22px;display:grid;gap:12px}
.sect h2{font-size:1.35rem;padding-inline:2px}
.cupbox{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:14px 16px}
.cupbox svg{width:96px;height:96px}
.cupbox .lvl{font-family:var(--display);font-size:1.3rem;font-weight:700;line-height:1.15}
.cupbox .sub{font-size:.86rem;color:var(--muted);font-weight:600}
.meter{height:8px;border-radius:4px;background:var(--surface2);overflow:hidden;margin-top:8px}
.meter i{display:block;height:100%;background:var(--leaf);border-radius:4px;transition:width .6s ease}
.howpts{color:var(--muted);font-size:.86rem;font-weight:600;padding-inline:2px}
.steam path{animation:steam 2.4s ease-in-out infinite}
.steam path:nth-child(2){animation-delay:.6s}.steam path:nth-child(3){animation-delay:1.2s}
.stamps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.stamp{display:grid;justify-items:center;gap:6px;text-align:center;font-size:.7rem;font-weight:700;line-height:1.2;color:var(--muted)}
.stamp .s{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;border:2px dashed var(--line);color:var(--line)}
.stamp .s svg{width:28px;height:28px}
.stamp.on{color:var(--ink)}
.stamp.on .s{border:3px double var(--c);color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);transform:rotate(-9deg)}

/* Tappa */
.when{display:inline-flex;align-items:center;gap:8px;font-size:.78rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:26px;padding:20px 18px;display:grid;gap:16px;
  box-shadow:0 18px 40px -30px var(--shadow);position:relative;overflow:hidden;animation:rise .35s ease-out}
.card::before{content:"";position:absolute;inset:0 0 auto 0;height:6px;background:var(--c)}
.num{font-family:var(--display);font-size:3.2rem;font-weight:700;line-height:.9;color:var(--c);font-variant-numeric:tabular-nums}
.qlbl{display:flex;align-items:center;gap:8px;font-size:.72rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.qlbl svg{width:16px;height:16px}
.q{font-family:var(--display);font-size:1.4rem;line-height:1.28;font-weight:600}
.opts{display:grid;gap:8px}
.opt{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:10px 14px;border-radius:16px;text-align:left;
  background:var(--surface2);border:2px solid transparent;font-weight:700;font-size:1rem;line-height:1.3;transition:transform .12s ease}
.opt:active{transform:scale(.98)}
.opt .k{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--surface);font-size:.85rem;font-weight:800;color:var(--muted)}
.opt .k svg{width:18px;height:18px;stroke-width:2.6}
.opt.right{background:var(--okbg);border-color:var(--ok)}
.opt.right .k{background:var(--ok);color:#fff}
.opt.wrong{background:var(--kobg);border-color:var(--ko)}
.opt.wrong .k{background:var(--ko);color:#fff}
.opt.dim{opacity:.45}
.opts.answered .opt{cursor:default}
.opts.answered .opt:active{transform:none}
.verdict{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;border-radius:16px;padding:12px 14px;font-size:.95rem;animation:rise .3s ease-out}
.verdict b{display:block;font-size:1rem}
.verdict.ok{background:var(--okbg)}.verdict.ko{background:var(--kobg)}
.verdict .gain{flex:none;display:inline-flex;align-items:center;gap:4px;font-weight:800;color:var(--leaf)}
.verdict .gain svg{width:18px;height:18px}

.place{display:grid;gap:6px;animation:rise .4s ease-out}
.place .lbl{font-size:.72rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.place h2{font-size:1.75rem}
.place p{color:var(--muted);font-size:.98rem}
.chipbtn{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border-radius:999px;background:var(--surface2);font-weight:700;font-size:.92rem}
.chipbtn svg{width:18px;height:18px}
a.chipbtn{color:var(--ink);text-decoration:none}
.mystery{display:flex;align-items:center;gap:12px;background:var(--surface2);border-radius:16px;padding:12px 14px;color:var(--muted);font-weight:700;font-size:.92rem}
.mystery .qm{width:36px;height:36px;border-radius:50%;border:2px dashed var(--muted);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:1.1rem;flex:none}

.mission{display:grid;gap:12px;border-radius:20px;padding:16px;background:var(--blush)}
.mission .lbl{display:flex;align-items:center;gap:8px;font-size:.72rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.mission .lbl svg{width:16px;height:16px}
.mission p{font-weight:700;font-size:1.08rem;line-height:1.35}
.shot{display:grid;place-items:center;gap:8px;min-height:160px;border-radius:16px;border:2px dashed color-mix(in srgb,var(--accent) 55%,transparent);
  background:color-mix(in srgb,var(--surface) 70%,transparent);color:var(--accent);font-weight:800;text-align:center;padding:16px;width:100%}
.shot svg{width:40px;height:40px;stroke-width:1.6}
.shot small{display:block;font-weight:600;color:var(--muted);font-size:.82rem}
.pic{position:relative;border-radius:16px;overflow:hidden}
.pic img{width:100%;max-height:60vh;object-fit:cover;display:block}
.pic button{position:absolute;right:10px;bottom:10px;display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border-radius:999px;
  background:rgba(20,15,12,.6);color:#fff;font-weight:700;font-size:.85rem;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.pic button svg{width:18px;height:18px}
.saving{font-size:.88rem;color:var(--muted);font-weight:600}
.err{font-size:.9rem;color:var(--ko);font-weight:700}
.note{font-size:.88rem;font-weight:700;color:var(--muted)}

.minor{display:flex;justify-content:center;padding-top:4px}
.minor button{min-height:44px;padding:0 10px;color:var(--muted);font-size:.88rem;font-weight:600;text-decoration:underline;text-underline-offset:3px}
.confirm{display:grid;gap:10px;background:var(--surface2);border-radius:16px;padding:14px;font-size:.95rem}
.confirm .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.confirm button{min-height:46px;border-radius:12px;font-weight:800;background:var(--surface);border:1px solid var(--line)}
.confirm button.danger{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.nav{display:flex;justify-content:space-between;margin-top:14px}
.nav button{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 12px;border-radius:999px;color:var(--muted);font-weight:700;font-size:.88rem}
.nav button:disabled{opacity:.3}
.locked{display:grid;gap:14px;justify-items:center;text-align:center;padding:30px 10px}
.locked .lock{width:72px;height:72px;border-radius:50%;border:2px dashed var(--muted);display:grid;place-items:center;color:var(--muted);font-family:var(--display);font-size:2rem;font-weight:700}
.locked p{color:var(--muted)}

/* Bottone d'azione */
.cta{position:fixed;left:0;right:0;bottom:calc(var(--tab) + var(--sb));z-index:11;padding:10px 16px 12px;background:linear-gradient(to top,var(--bg) 70%,transparent)}
.cta .in{max-width:560px;margin:0 auto}
.primary{width:100%;min-height:58px;border-radius:18px;background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:1.05rem;
  display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 12px 26px -14px var(--accent);transition:transform .12s ease;-webkit-user-select:none;user-select:none}
.primary:active{transform:scale(.98)}
.primary.alt{background:var(--ink);color:var(--bg);box-shadow:none}
.primary .pts{display:inline-flex;align-items:center;gap:4px;font-size:.85rem;font-weight:800;background:rgba(255,255,255,.22);border-radius:999px;padding:2px 9px}
.primary .pts svg{width:15px;height:15px}

/* Schede */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:12;height:calc(var(--tab) + var(--sb));padding-bottom:var(--sb);
  background:color-mix(in srgb,var(--surface) 92%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
  border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr)}
.tabs button{display:grid;justify-items:center;align-content:center;gap:3px;font-size:.72rem;font-weight:700;color:var(--muted)}
.tabs button[aria-current="page"]{color:var(--accent)}
.tabs .ic{position:relative;display:grid;place-items:center}
.tabs .badge{position:absolute;left:16px;top:-5px;min-width:18px;height:18px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font-size:.68rem;display:grid;place-items:center;padding:0 5px}

/* Album */
.hero{display:grid;gap:8px;padding:12px 4px 4px}
.hero h1{font-size:2.1rem;color:var(--accent)}
.hero h1 em{font-weight:400;color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}
.grid button{position:relative;border-radius:16px;overflow:hidden;aspect-ratio:3/4;background:var(--surface2)}
.grid button:nth-child(3n+1){aspect-ratio:1}
.grid img{width:100%;height:100%;object-fit:cover;display:block}
.grid .cap{position:absolute;left:0;right:0;bottom:0;padding:22px 10px 8px;background:linear-gradient(transparent,rgba(0,0,0,.65));color:#fff;font-size:.78rem;font-weight:700;text-align:left;line-height:1.25}
.empty{display:grid;gap:10px;justify-items:center;text-align:center;padding:50px 20px;color:var(--muted)}
.empty svg{width:44px;height:44px;stroke-width:1.5}
.treasure{border-radius:26px;padding:26px 20px;display:grid;gap:10px;text-align:center;background:var(--surface);border:1px solid var(--line)}
.treasure h2{font-size:2.2rem;color:var(--accent)}
.treasure svg.cup{width:120px;height:120px}
.sign{font-family:var(--display);font-style:italic;color:var(--accent)}

/* Visore */
.viewer{position:fixed;inset:0;z-index:30;background:#0d0a0c;color:#fff;display:grid;grid-template-rows:auto 1fr auto;padding:calc(var(--st) + 8px) 12px calc(var(--sb) + 12px)}
.viewer .vt{display:flex;justify-content:space-between;align-items:center}
.viewer .vt button,.viewer .vb button{min-height:44px;min-width:44px;display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;padding:0 14px;background:rgba(255,255,255,.12);font-weight:700;font-size:.9rem}
.viewer .stage{display:grid;place-items:center;min-height:0;touch-action:pan-y}
.viewer img{max-width:100%;max-height:100%;object-fit:contain;border-radius:10px;-webkit-touch-callout:default}
.viewer .vb{display:grid;gap:10px;text-align:center}
.viewer .vb b{font-family:var(--display);font-size:1.15rem}
.viewer .vb span{font-size:.8rem;opacity:.7}
.viewer .vb .acts{display:flex;justify-content:center;gap:8px}

/* Festa */
.party{position:fixed;inset:0;z-index:40;background:color-mix(in srgb,var(--bg) 80%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);display:grid;place-items:center;padding:24px}
.party canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
.party .box{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:28px;padding:22px 22px 20px;display:grid;gap:12px;justify-items:center;text-align:center;
  max-width:360px;width:100%;box-shadow:0 30px 60px -30px var(--shadow);animation:popin .45s cubic-bezier(.2,1.4,.4,1)}
.party .box svg.cup{width:110px;height:110px}
.party h2{font-size:1.6rem}
.party .gain{display:inline-flex;align-items:center;gap:8px;font-family:var(--display);font-size:2.3rem;font-weight:700;color:var(--leaf);line-height:1}
.party .gain svg{width:30px;height:30px}
.party .rk{font-weight:800;background:var(--blush);border-radius:999px;padding:6px 14px;font-size:.9rem}
.party .newstamp{display:flex;align-items:center;gap:10px;font-weight:800;font-size:.92rem}
.party .newstamp .s{width:44px;height:44px;border-radius:50%;border:3px double var(--c);color:var(--c);display:grid;place-items:center;transform:rotate(-9deg)}
.party .newstamp .s svg{width:22px;height:22px}

/* Benvenuto e installazione */
.welcome{position:fixed;inset:0;z-index:50;background:var(--bg);display:grid;align-content:center;gap:20px;padding:calc(var(--st) + 24px) 24px calc(var(--sb) + 24px);overflow:auto}
.welcome .k{font-size:.75rem;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
.welcome h1{font-size:clamp(2.8rem,14vw,4rem);font-weight:700;color:var(--accent);line-height:.95}
.welcome h1 em{display:block;font-weight:400;color:var(--ink)}
.rules{display:grid;gap:10px;list-style:none;padding:0;margin:0}
.rules li{display:flex;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:11px 14px;font-weight:600;font-size:.96rem}
.rules .ri{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex:none;background:var(--blush);color:var(--accent)}
.rules .ri.g{background:var(--okbg);color:var(--leaf)}
.sheet{position:fixed;left:10px;right:10px;bottom:calc(var(--tab) + var(--sb) + 84px);z-index:35;background:var(--ink);color:var(--bg);border-radius:20px;padding:16px;
  display:grid;gap:10px;box-shadow:0 20px 40px -20px var(--shadow);animation:rise .35s ease-out;max-width:540px;margin:0 auto}
.sheet p{font-size:.92rem;opacity:.9}
.sheet button{justify-self:end;min-height:44px;padding:0 18px;border-radius:999px;background:var(--bg);color:var(--ink);font-weight:800}
.toast{position:fixed;left:50%;top:calc(var(--st) + 70px);transform:translateX(-50%);z-index:45;background:var(--ink);color:var(--bg);border-radius:999px;padding:10px 18px;font-weight:700;font-size:.9rem;animation:rise .3s ease-out;white-space:nowrap}
input[type=file]{position:fixed;left:-9999px;width:1px;height:1px;opacity:0}

@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes popin{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:none}}
@keyframes bump{40%{transform:scale(1.15)}}
@keyframes pulse{0%{transform:scale(1);opacity:.7}100%{transform:scale(2.2);opacity:0}}
@keyframes steam{0%,100%{opacity:0;transform:translateY(4px)}50%{opacity:.8;transform:translateY(-3px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

/* ---------- Foto (IndexedDB, restano sul telefono) ---------- */
var dbp=null;
function idb(){if(dbp)return dbp;dbp=new Promise(function(res,rej){
  if(!window.indexedDB)return rej('no idb');var r=indexedDB.open('chasse-ugo',1);
  r.onupgradeneeded=function(){r.result.createObjectStore('photos');};
  r.onsuccess=function(){res(r.result);};r.onerror=function(){rej(r.error);};});return dbp;}
function putPhoto(id,blob){return idb().then(function(db){return new Promise(function(res,rej){
  var t=db.transaction('photos','readwrite');t.objectStore('photos').put(blob,id);t.oncomplete=res;t.onerror=function(){rej(t.error);};});});}
function getPhoto(id){return idb().then(function(db){return new Promise(function(res){
  var q=db.transaction('photos').objectStore('photos').get(id);q.onsuccess=function(){res(q.result||null);};q.onerror=function(){res(null);};});}).catch(function(){return null;});}
function clearPhotos(){return idb().then(function(db){return new Promise(function(res){
  var t=db.transaction('photos','readwrite');t.objectStore('photos').clear();t.oncomplete=res;t.onerror=res;});}).catch(function(){});}
var urls={};
function photoUrl(id){if(urls[id])return Promise.resolve(urls[id]);
  return getPhoto(id).then(function(b){if(!b)return null;urls[id]=URL.createObjectURL(b);return urls[id];});}
function hydrate(root){root.querySelectorAll('img[data-photo]').forEach(function(im){photoUrl(im.getAttribute('data-photo')).then(function(u){if(u)im.src=u;});});}
function loadImage(file){
  if(window.createImageBitmap)return createImageBitmap(file,{imageOrientation:'from-image'}).catch(function(){return viaImg(file);});
  return viaImg(file);}
function viaImg(file){return new Promise(function(res,rej){var im=new Image();im.onload=function(){res(im);};im.onerror=rej;im.src=URL.createObjectURL(file);});}
function compress(file){return loadImage(file).then(function(img){
  var w=img.width,h=img.height,s=Math.min(1,1600/Math.max(w,h));
  var c=document.createElement('canvas');c.width=Math.round(w*s);c.height=Math.round(h*s);
  c.getContext('2d').drawImage(img,0,0,c.width,c.height);
  return new Promise(function(res){c.toBlob(function(b){res(b||file);},'image/jpeg',0.85);});
}).catch(function(){return file;});}

/* ---------- Calcoli ---------- */
function answered(s){return S.answer[s.id]!==undefined;}
function right(s){return S.answer[s.id]===s.a;}
function settled(id){return !!(S.done[id]||S.skipped[id]);}
function currentIndex(){for(var i=0;i<STEPS.length;i++)if(!settled(STEPS[i].id))return i;return -1;}
function stepPoints(s){return (right(s)?PTS.answer:0)+(S.done[s.id]&&S.photo[s.id]?PTS.photo:0)+(S.done[s.id]?PTS.done:0);}
function points(){return STEPS.reduce(function(p,s){return p+stepPoints(s);},0);}
function level(p){var k=0;LEVELS.forEach(function(x,i){if(p>=x[0])k=i;});return k;}
function unlocked(i){var s=STEPS[i];return settled(s.id)||i===currentIndex()||!!S.opened[s.id];}
function focusIndex(){return V.focus===null?currentIndex():V.focus;}
function photoCount(){return STEPS.filter(function(s){return S.photo[s.id];}).length;}

function mapSvg(){

  [[30,230],[54,216],[150,240],[174,226],[24,420],[54,436],[196,140],[220,126],[180,450],[150,480],[390,250],[414,236],[110,560],[136,546],[340,420],[364,406]].forEach(function(m){
    h+='<path d="M'+m[0]+' '+m[1]+' l12 -18 l12 18" fill="none" stroke="var(--line)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>';});
  h+='<text x="380" y="56" font-size="13" font-weight="700" letter-spacing="3">MYANMAR</text>';

  h+='<text x="24" y="636" font-size="11" font-weight="700" letter-spacing="2">10 km</text><path d="M24 644h95" stroke="var(--muted)" stroke-width="2"/>';
  h+='<g transform="translate(66 70)"><circle r="22" fill="none" stroke="var(--muted)" stroke-width="2" stroke-dasharray="3 4"/><path d="M0 -16 L6 0 L0 16 L-6 0z" fill="var(--accent)"/><text y="-28" text-anchor="middle" font-size="12" font-weight="800">N</text></g>';
  var last=cur<0?STEPS.length-1:cur;
  for(var i=1;i<=last;i++){var a=STEPS[i-1],b=STEPS[i],ahead=(i===last&&cur>=0);
    h+='<path d="M'+a.x+' '+a.y+' L'+b.x+' '+b.y+'" stroke="'+DAYCOLOR[b.day]+'" stroke-width="'+(ahead?3:5)+'" stroke-linecap="round" fill="none"'+(ahead?' stroke-dasharray="1 9"':'')+' filter="url(#rough)"/>';}
  var labels='';

      h+='<circle cx="'+s.x+'" cy="'+s.y+'" r="14" fill="'+c+'" stroke="var(--paper)" stroke-width="3"/>';

    }else if(here){

      h+='<text x="'+s.x+'" y="'+(s.y+5)+'" text-anchor="middle" font-size="13" font-weight="800" style="fill:var(--ink)">'+(i+1)+'</text>';

    h+='<div><a class="chipbtn" href="'+esc(s.maps)+'" target="_blank" rel="noopener">'+ic('pin')+'Apri in Maps</a></div>';
    h+='<div class="mission"><span class="lbl">'+ic('cam')+'Sfida foto · +2 foglie</span><p>'+esc(s.mission)+'</p>';
    if(S.photo[s.id])h+='<div class="pic"><img data-photo="'+s.id+'" alt="La vostra foto: '+esc(s.place)+'" data-act="view" data-id="'+s.id+'"><button data-act="photo">'+ic('swap')+'Cambia</button></div>';
    else h+='<button class="shot" data-act="photo">'+ic('cam')+'<span>Scatta o scegli la foto<small>Fotocamera o galleria</small></span></button>';

/* ---------- Azioni ---------- */
function buzz(ms){try{navigator.vibrate&&navigator.vibrate(ms);}catch(e){}}
document.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('g[data-act]')){e.preventDefault();e.target.dispatchEvent(new MouseEvent('click',{bubbles:true}));}});
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b)return;var a=b.getAttribute('data-act');
  var i=focusIndex(),s=i>=0?STEPS[i]:null;
  switch(a){
    case 'tab':V.tab=b.getAttribute('data-tab');V.confirmReset=false;render();scrollTo(0,0);break;
    case 'answer':if(answered(s))return;S.answer[s.id]=+b.getAttribute('data-k');save();render();
      if(right(s)){bump();buzz(25);}else buzz([40,60,40]);break;
    case 'photo':pickFor=s.id;$('file').value='';$('file').click();break;
    case 'validate':validate(i);break;
    case 'askskip':V.confirmSkip=true;render();break;
    case 'noskip':V.confirmSkip=false;render();break;
    case 'skip':S.skipped[s.id]=true;save();V.confirmSkip=false;V.focus=null;render();scrollTo(0,0);toast('Tappa saltata');break;
    case 'unlock':S.opened[s.id]=true;save();render();break;
    case 'prev':V.focus=Math.max(0,i-1);V.confirmSkip=false;render();scrollTo(0,0);break;
    case 'next':V.focus=Math.min(STEPS.length-1,i+1);V.confirmSkip=false;render();scrollTo(0,0);break;
    case 'resume':V.tab='hunt';V.focus=null;render();scrollTo(0,0);break;
    case 'goto':V.tab='hunt';V.focus=+b.getAttribute('data-i');V.confirmSkip=false;render();scrollTo(0,0);break;
    case 'view':openViewer(b.getAttribute('data-id'));break;
    case 'shareall':shareFiles(STEPS.filter(function(x){return S.photo[x.id];}));break;
    case 'askreset':V.confirmReset=true;render();break;
    case 'noreset':V.confirmReset=false;render();break;
    case 'reset':S=Object.assign(fresh(),{started:true,installSeen:S.installSeen});save();
      clearPhotos().then(function(){urls={};V={tab:'map',focus:null};render();scrollTo(0,0);toast('Caccia azzerata');});break;
  }
});

var pickFor=null;
$('file').addEventListener('change',function(){
  var f=this.files&&this.files[0],id=pickFor;if(!f||!id)return;
  V.saving=id;V.error=null;render();
  compress(f).then(function(blob){return putPhoto(id,blob);}).then(function(){
    if(urls[id]){URL.revokeObjectURL(urls[id]);delete urls[id];}
    S.photo[id]=true;save();V.saving=null;buzz(15);render();
  }).catch(function(){V.saving=null;V.error="La foto non è stata salvata. Forse la memoria del telefono è piena: riprova con un'altra foto.";render();});
});

function validate(i){
  var s=STEPS[i],lv=level(points()),before=earned();
  S.done[s.id]=Date.now();delete S.skipped[s.id];save();
  var gain=PTS.done+(S.photo[s.id]?PTS.photo:0),lv2=level(points());
  var news=earned().filter(function(x){return before.indexOf(x)<0;});
  V.focus=null;V.confirmSkip=false;render();scrollTo(0,0);bump();buzz([20,40,20]);
  celebrate(s,gain,lv2>lv?LEVELS[lv2][1]:null,news);
}
function bump(){var e=$('leaves');if(e){e.classList.remove('bump');void e.offsetWidth;e.classList.add('bump');}}
function toast(t){var d=document.createElement('div');d.className='toast';d.textContent=t;$('layer').appendChild(d);setTimeout(function(){d.remove();},1800);}

/* ---------- Festa ---------- */
function celebrate(s,gain,newLevel,stamps){
  var last=currentIndex()<0,p=points();
  var box=document.createElement('div');box.className='party';
  var st=stamps.map(function(id){var b=STAMPS.filter(function(x){return x.id===id;})[0];
    return '<span class="newstamp" style="--c:'+b.c+'"><span class="s">'+ic(b.icon)+'</span>Nuovo timbro: '+esc(b.name)+'</span>';}).join('');
  box.innerHTML='<canvas></canvas><div class="box" role="dialog" aria-modal="true" aria-label="Tappa convalidata">'+cupSvg(p,'cup')+
    '<h2>'+esc(s.place)+'</h2><span class="gain">+'+gain+ic('leaf')+'</span>'+
    '<span class="rk">'+(newLevel?'Nuovo livello: '+esc(newLevel):esc(LEVELS[level(p)][1])+' · '+p+' foglie')+'</span>'+st+
    '<button class="primary" data-close>'+(last?ic('gift')+'<span>Scopri il tesoro</span>':ic('map')+'<span>Guarda la mappa</span>')+'</button></div>';
  $('layer').appendChild(box);
  var btn=box.querySelector('[data-close]');
  btn.addEventListener('click',function(){box.remove();V.tab=last?'hunt':'map';render();scrollTo(0,0);});
  btn.focus();
  confetti(box.querySelector('canvas'));
}
function confetti(cv){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  var dpr=Math.min(2,devicePixelRatio||1),W=innerWidth,H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;
  var x=cv.getContext('2d');x.scale(dpr,dpr);
  var cs=getComputedStyle(document.documentElement),cols=['--leaf','--leaf','--leaf','--d1','--d2','--gold'].map(function(v){return cs.getPropertyValue(v).trim();});
  var P=[];for(var k=0;k<110;k++)P.push({x:W/2,y:H*.4,vx:(Math.random()-.5)*11,vy:-Math.random()*13-4,r:Math.random()*7+6,a:Math.random()*6,va:(Math.random()-.5)*.25,c:cols[k%cols.length]});
  var t0=performance.now();
  (function f(t){x.clearRect(0,0,W,H);
    P.forEach(function(p){p.vy+=.3;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.a+=p.va;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;
      x.beginPath();x.ellipse(0,0,p.r,p.r*.45,0,0,Math.PI*2);x.fill();x.restore();});
    if(t-t0<2600&&cv.isConnected)requestAnimationFrame(f);else x.clearRect(0,0,W,H);})(t0);
}

/* ---------- Visore ---------- */
function openViewer(id){
  var list=STEPS.filter(function(s){return S.photo[s.id];}),k=list.findIndex(function(s){return s.id===id;});if(k<0)return;
  var v=document.createElement('div');v.className='viewer';v.setAttribute('role','dialog');v.setAttribute('aria-modal','true');
  function draw(){var s=list[k];
    v.innerHTML='<div class="vt"><span style="font-weight:700;font-size:.9rem;opacity:.8">'+(k+1)+' / '+list.length+'</span><button data-v="close" aria-label="Chiudi">'+ic('x')+'</button></div>'+
      '<div class="stage"><img data-photo="'+s.id+'" alt="'+esc(s.place)+'"></div>'+
      '<div class="vb"><div><b>'+esc(s.place)+'</b><br><span>'+esc(s.when)+' · tienila premuta per salvarla</span></div><div class="acts">'+
      '<button data-v="prev" aria-label="Foto precedente"'+(k===0?' disabled style="opacity:.3"':'')+'>'+ic('left')+'</button>'+
      '<button data-v="share">'+ic('share')+'Condividi</button>'+
      '<button data-v="next" aria-label="Foto successiva"'+(k===list.length-1?' disabled style="opacity:.3"':'')+'>'+ic('right')+'</button></div></div>';
    hydrate(v);}
  v.addEventListener('click',function(e){var b=e.target.closest('[data-v]');if(!b)return;var a=b.getAttribute('data-v');
    if(a==='close')v.remove();else if(a==='prev'&&k>0){k--;draw();}else if(a==='next'&&k<list.length-1){k++;draw();}else if(a==='share')shareFiles([list[k]]);});
  var sx=null;v.addEventListener('touchstart',function(e){sx=e.touches[0].clientX;},{passive:true});
  v.addEventListener('touchend',function(e){if(sx===null)return;var dx=e.changedTouches[0].clientX-sx;sx=null;
    if(dx<-50&&k<list.length-1){k++;draw();}else if(dx>50&&k>0){k--;draw();}});
  draw();$('layer').appendChild(v);
}

/* ---------- Condivisione ---------- */
function shareFiles(list){
  Promise.all(list.map(function(s){return getPhoto(s.id).then(function(b){
    var n=STEPS.indexOf(s)+1;return b?new File([b],String(n).padStart(2,'0')+'-'+s.id+'.jpg',{type:'image/jpeg'}):null;});}))
  .then(function(files){files=files.filter(Boolean);
    if(navigator.canShare&&navigator.canShare({files:files}))return navigator.share({files:files,title:'Boucle du Nord'});
    toast('Apri la foto e tienila premuta per salvarla');})
  .catch(function(e){if(!e||e.name!=='AbortError')toast('Condivisione non riuscita');});
}

/* ---------- Benvenuto e installazione ---------- */
function welcome(){
  var w=document.createElement('div');w.className='welcome';
  w.innerHTML='<span class="k">Nord della Thailandia · 15 → 18 ottobre</span><h1>La caccia<em>di Ugo</em></h1>'+
    '<p style="font-size:1.05rem">16 tappe, 4 giorni di scooter, un quiz a ogni sosta.</p>'+
    '<ul class="rules"><li><span class="ri">'+ic('quiz')+'</span>Rispondi al quiz e scopri il luogo</li>'+
    '<li><span class="ri">'+ic('cam')+'</span>Supera la sfida con una foto di noi due</li>'+
    '<li><span class="ri g">'+ic('leaf')+'</span>Raccogli foglie di tè e riempi la tazza</li>'+
    '<li><span class="ri">'+ic('map')+'</span>Scopri la mappa e colleziona i timbri</li></ul>'+
    '<p class="sign" style="font-size:1.1rem">Lison</p>'+
    '<button class="primary" data-start>'+ic('compass')+'<span>Si parte!</span></button>';
  document.body.appendChild(w);
  w.querySelector('[data-start]').addEventListener('click',function(){S.started=true;save();w.remove();installSheet();});
}
function installSheet(){
  var standalone=(window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||navigator.standalone===true;
  if(standalone||S.installSeen)return;
  var d=document.createElement('div');d.className='sheet';d.setAttribute('role','dialog');
  d.innerHTML='<b>Da fare una volta, con il wifi</b><p>In Safari: tocca Condividi, poi « Aggiungi alla schermata Home ». Poi apri la caccia sempre dall\'icona: funziona senza connessione e conserva le foto.</p><button>Ho capito</button>';
  $('layer').appendChild(d);
  d.querySelector('button').addEventListener('click',function(){S.installSeen=true;save();d.remove();});
}

if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(function(){});
render();
if(!S.started)welcome();else installSheet();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(function(){});
</script>
</body>
</html>
