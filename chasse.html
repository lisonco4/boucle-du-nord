<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>La chasse d'Ugo</title>
<meta name="theme-color" content="#FAF3E0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17131A" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="chasse.webmanifest">
<link rel="apple-touch-icon" href="icons/chasse-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Chasse d'Ugo">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* Layout : app mobile. Barre du haut (étape + score), une étape à la fois en plein écran,
   bouton d'action contextuel dans la zone du pouce, barre d'onglets en bas. */
:root{
  --bg:#FAF3E0; --surface:#FFFDF8; --surface2:#F3EAD3; --ink:#1F1A17; --muted:#6B6157; --line:#E8DCC2;
  --accent:#D6457F; --accent-ink:#FFFFFF; --blush:#FBC9DC; --gold:#D99A1E; --shadow:rgba(80,50,20,.18);
  --d1:#F386AE; --d2:#9C87BC; --d3:#6F98C8; --d4:#7FA477;
  --display:"Fraunces", Georgia, "Times New Roman", serif;
  --body:"Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  --tab:64px; --sb:env(safe-area-inset-bottom,0px); --st:env(safe-area-inset-top,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#17131A; --surface:#221C24; --surface2:#2C2530; --ink:#F6EEE6; --muted:#B3A79F; --line:#3A3140;
  --accent:#F386AE; --accent-ink:#1A1016; --blush:#4A2A3A; --gold:#F0C766; --shadow:rgba(0,0,0,.5);
  --d1:#F59BBE; --d2:#B6A3D6; --d3:#8DB2DD; --d4:#9CC293; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17131A; --surface:#221C24; --surface2:#2C2530; --ink:#F6EEE6; --muted:#B3A79F; --line:#3A3140;
  --accent:#F386AE; --accent-ink:#1A1016; --blush:#4A2A3A; --gold:#F0C766; --shadow:rgba(0,0,0,.5);
  --d1:#F59BBE; --d2:#B6A3D6; --d3:#8DB2DD; --d4:#9CC293; color-scheme:dark}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;
  padding-top:var(--st);-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
h1,h2,h3{font-family:var(--display);font-weight:600;line-height:1.1;margin:0;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
button:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:12px}
svg.i{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* Barre du haut */
.top{position:sticky;top:var(--st);z-index:10;background:color-mix(in srgb,var(--bg) 88%,transparent);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);padding:10px 16px 8px;display:grid;gap:8px}
.top .bar{display:flex;align-items:center;justify-content:space-between;gap:10px}
.top .title{font-family:var(--display);font-weight:700;font-size:1.15rem;display:flex;align-items:center;gap:8px;min-width:0}
.top .title small{font-family:var(--body);font-size:.78rem;font-weight:700;color:var(--muted);letter-spacing:.04em}
.score{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;
  padding:6px 12px 6px 8px;font-weight:800;font-variant-numeric:tabular-nums;font-size:.95rem}
.score .star{width:22px;height:22px;border-radius:50%;background:var(--gold);color:#fff;display:grid;place-items:center}
.score .star svg{width:13px;height:13px;stroke-width:2.6}
.score.bump{animation:bump .5s ease}
.seg{display:grid;grid-template-columns:repeat(16,1fr);gap:3px}
.seg i{height:5px;border-radius:3px;background:var(--line)}
.seg i.done{background:var(--c)}
.seg i.skip{background:color-mix(in srgb,var(--c) 30%,var(--line))}
.seg i.here{background:var(--ink)}

main{padding:6px 16px calc(var(--tab) + var(--sb) + 104px);max-width:560px;margin:0 auto}

/* Étape en plein écran */
.when{display:inline-flex;align-items:center;gap:8px;font-size:.78rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:26px;padding:20px 18px;display:grid;gap:16px;
  box-shadow:0 18px 40px -30px var(--shadow);position:relative;overflow:hidden;animation:rise .35s ease-out}
.card::before{content:"";position:absolute;inset:0 0 auto 0;height:6px;background:var(--c)}
.num{font-family:var(--display);font-size:3.2rem;font-weight:700;line-height:.9;color:var(--c);font-variant-numeric:tabular-nums}
.riddle{font-family:var(--display);font-style:italic;font-weight:400;font-size:1.42rem;line-height:1.38;color:var(--ink)}
.hint{display:flex;gap:10px;align-items:flex-start;background:var(--surface2);border-radius:16px;padding:12px 14px;font-size:.95rem}
.hint svg{color:var(--gold);margin-top:1px}
.chipbtn{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border-radius:999px;background:var(--surface2);font-weight:700;font-size:.92rem}
.chipbtn svg{width:18px;height:18px}

.place{display:grid;gap:6px}
.place .lbl{font-size:.72rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.place h2{font-size:1.85rem;color:var(--ink)}
.place p{color:var(--muted);font-size:.98rem}
.place.veiled h2{filter:blur(11px);user-select:none}
.place.veiled p{filter:blur(6px);user-select:none}
.place.shown h2{animation:unveil .6s ease-out}
.links{display:flex;flex-wrap:wrap;gap:8px}

.guess{display:grid;gap:10px;background:var(--surface2);border-radius:18px;padding:14px}
.guess b{font-size:.98rem}
.guess .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.guess button{min-height:48px;border-radius:14px;font-weight:800;background:var(--surface);border:1px solid var(--line)}
.guess button.yes{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.guessed{font-size:.88rem;font-weight:700;color:var(--muted)}

.mission{display:grid;gap:12px;border-radius:20px;padding:16px;background:var(--blush)}
.mission .lbl{display:flex;align-items:center;gap:8px;font-size:.72rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.mission .lbl svg{width:16px;height:16px}
.mission p{font-weight:700;font-size:1.08rem;line-height:1.35}
.shot{display:grid;place-items:center;gap:8px;min-height:170px;border-radius:16px;border:2px dashed color-mix(in srgb,var(--accent) 55%,transparent);
  background:color-mix(in srgb,var(--surface) 70%,transparent);color:var(--accent);font-weight:800;text-align:center;padding:16px;width:100%}
.shot svg{width:40px;height:40px;stroke-width:1.6}
.shot small{display:block;font-weight:600;color:var(--muted);font-size:.82rem}
.pic{position:relative;border-radius:16px;overflow:hidden}
.pic img{width:100%;max-height:60vh;object-fit:cover;display:block}
.pic button{position:absolute;right:10px;bottom:10px;display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border-radius:999px;
  background:rgba(20,15,12,.6);color:#fff;font-weight:700;font-size:.85rem;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.pic button svg{width:18px;height:18px}
.saving{font-size:.88rem;color:var(--muted);font-weight:600}
.err{font-size:.9rem;color:var(--accent);font-weight:700}

.minor{display:flex;justify-content:center;padding-top:4px}
.minor button{min-height:44px;padding:0 10px;color:var(--muted);font-size:.88rem;font-weight:600;text-decoration:underline;text-underline-offset:3px}
.confirm{display:grid;gap:10px;background:var(--surface2);border-radius:16px;padding:14px;font-size:.95rem}
.confirm .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.confirm button{min-height:46px;border-radius:12px;font-weight:800;background:var(--surface);border:1px solid var(--line)}
.confirm button.danger{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.nav{display:flex;justify-content:space-between;margin-top:14px}
.nav button{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 12px;border-radius:999px;color:var(--muted);font-weight:700;font-size:.88rem}
.nav button:disabled{opacity:.3}

.locked{display:grid;gap:14px;justify-items:center;text-align:center;padding:30px 10px}
.locked .lock{width:72px;height:72px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;color:var(--muted)}
.locked .lock svg{width:32px;height:32px}
.locked p{color:var(--muted)}

/* Bouton d'action, zone du pouce */
.cta{position:fixed;left:0;right:0;bottom:calc(var(--tab) + var(--sb));z-index:11;padding:10px 16px 12px;
  background:linear-gradient(to top,var(--bg) 70%,transparent)}
.cta .in{max-width:560px;margin:0 auto}
.primary{width:100%;min-height:58px;border-radius:18px;background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:1.05rem;
  display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 12px 26px -14px var(--accent);position:relative;overflow:hidden;
  transition:transform .12s ease;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none}
.primary:active{transform:scale(.98)}
.primary.alt{background:var(--ink);color:var(--bg);box-shadow:none}
.primary .fill{position:absolute;inset:0;transform-origin:left;transform:scaleX(var(--p,0));background:rgba(255,255,255,.28)}
.primary span,.primary svg{position:relative}
.primary .pts{font-size:.85rem;font-weight:800;background:rgba(255,255,255,.22);border-radius:999px;padding:2px 9px}

/* Onglets */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:12;height:calc(var(--tab) + var(--sb));padding-bottom:var(--sb);
  background:color-mix(in srgb,var(--surface) 92%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
  border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr)}
.tabs button{display:grid;justify-items:center;align-content:center;gap:3px;font-size:.72rem;font-weight:700;color:var(--muted)}
.tabs button[aria-current="page"]{color:var(--accent)}
.tabs .badge{position:absolute;margin-left:22px;margin-top:-4px;min-width:18px;height:18px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font-size:.68rem;display:grid;place-items:center;padding:0 5px}
.tabs .ic{position:relative;display:grid;place-items:center}

/* Parcours */
.dayh{display:flex;align-items:center;gap:10px;margin:22px 4px 10px}
.dayh h2{font-size:1.25rem}
.dayh small{color:var(--muted);font-weight:700;font-size:.8rem;margin-left:auto;font-variant-numeric:tabular-nums}
.list{display:grid;gap:8px;list-style:none;padding:0;margin:0}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:10px 12px;min-height:66px}
.row .b{width:36px;height:36px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:800;font-size:.85rem;border:2px solid var(--c);font-variant-numeric:tabular-nums}
.row.done .b{background:var(--c);color:#fff;border-color:var(--c)}
.row.here{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.row .t{display:grid;min-width:0;flex:1}
.row .t b{font-family:var(--display);font-weight:600;font-size:1.05rem;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t span{font-size:.78rem;color:var(--muted);font-weight:700}
.row.lock .t b{color:var(--muted);font-style:italic;font-weight:400}
.row img{width:46px;height:46px;border-radius:12px;object-fit:cover;flex:none}
.row .go{color:var(--muted)}
.hero{display:grid;gap:8px;padding:12px 4px 4px}
.hero h1{font-size:2.2rem;color:var(--accent)}
.hero h1 em{font-weight:400;color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;display:grid;gap:2px}
.stat b{font-family:var(--display);font-size:1.6rem;font-variant-numeric:tabular-nums;line-height:1}
.stat span{font-size:.75rem;color:var(--muted);font-weight:700}

/* Album */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}
.grid button{position:relative;border-radius:16px;overflow:hidden;aspect-ratio:3/4;background:var(--surface2)}
.grid button:nth-child(3n+1){aspect-ratio:1}
.grid img{width:100%;height:100%;object-fit:cover;display:block}
.grid .cap{position:absolute;left:0;right:0;bottom:0;padding:22px 10px 8px;background:linear-gradient(transparent,rgba(0,0,0,.65));color:#fff;
  font-size:.78rem;font-weight:700;text-align:left;line-height:1.25}
.empty{display:grid;gap:10px;justify-items:center;text-align:center;padding:50px 20px;color:var(--muted)}
.empty svg{width:44px;height:44px;stroke-width:1.5}
.treasure{border-radius:26px;padding:26px 20px;display:grid;gap:10px;text-align:center;background:var(--ink);color:var(--bg);margin-top:8px}
.treasure h2{font-size:2.2rem;color:var(--gold)}
.treasure p{opacity:.9}
.sign{font-family:var(--display);font-style:italic}

/* Visionneuse */
.viewer{position:fixed;inset:0;z-index:30;background:#0d0a0c;color:#fff;display:grid;grid-template-rows:auto 1fr auto;
  padding:calc(var(--st) + 8px) 12px calc(var(--sb) + 12px)}
.viewer .vt{display:flex;justify-content:space-between;align-items:center}
.viewer .vt button,.viewer .vb button{min-height:44px;min-width:44px;display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;padding:0 14px;background:rgba(255,255,255,.12);font-weight:700;font-size:.9rem}
.viewer .stage{display:grid;place-items:center;min-height:0;touch-action:pan-y}
.viewer img{max-width:100%;max-height:100%;object-fit:contain;border-radius:10px;-webkit-touch-callout:default}
.viewer .vb{display:grid;gap:10px;text-align:center}
.viewer .vb b{font-family:var(--display);font-size:1.15rem}
.viewer .vb span{font-size:.8rem;opacity:.7}
.viewer .vb .acts{display:flex;justify-content:center;gap:8px}

/* Fête */
.party{position:fixed;inset:0;z-index:40;background:color-mix(in srgb,var(--bg) 80%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  display:grid;place-items:center;padding:24px}
.party canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
.party .box{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:28px;padding:28px 22px 20px;display:grid;gap:12px;justify-items:center;text-align:center;
  max-width:360px;width:100%;box-shadow:0 30px 60px -30px var(--shadow);animation:popin .45s cubic-bezier(.2,1.4,.4,1)}
.party .ok{width:76px;height:76px;border-radius:50%;background:var(--c,var(--accent));color:#fff;display:grid;place-items:center}
.party .ok svg{width:40px;height:40px;stroke-width:3}
.party h2{font-size:1.7rem}
.party .gain{font-family:var(--display);font-size:2.6rem;font-weight:700;color:var(--gold);line-height:1}
.party .rk{font-weight:800;background:var(--blush);border-radius:999px;padding:6px 14px;font-size:.9rem}
.party .primary{margin-top:6px}

/* Accueil et installation */
.welcome{position:fixed;inset:0;z-index:50;background:var(--bg);display:grid;align-content:center;gap:22px;padding:calc(var(--st) + 24px) 24px calc(var(--sb) + 24px);overflow:auto}
.welcome .k{font-size:.75rem;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
.welcome h1{font-size:clamp(2.8rem,14vw,4rem);font-weight:700;color:var(--accent);line-height:.95}
.welcome h1 em{display:block;font-weight:400;color:var(--ink)}
.rules{display:grid;gap:12px;list-style:none;padding:0;margin:0}
.rules li{display:flex;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px 14px;font-weight:600;font-size:.98rem}
.rules .ri{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex:none;background:var(--blush);color:var(--accent)}
.sheet{position:fixed;left:10px;right:10px;bottom:calc(var(--tab) + var(--sb) + 84px);z-index:35;background:var(--ink);color:var(--bg);border-radius:20px;padding:16px;
  display:grid;gap:10px;box-shadow:0 20px 40px -20px var(--shadow);animation:rise .35s ease-out;max-width:540px;margin:0 auto}
.sheet b{font-size:1rem}
.sheet p{font-size:.92rem;opacity:.9}
.sheet button{justify-self:end;min-height:44px;padding:0 18px;border-radius:999px;background:var(--bg);color:var(--ink);font-weight:800}
.toast{position:fixed;left:50%;top:calc(var(--st) + 70px);transform:translateX(-50%);z-index:45;background:var(--ink);color:var(--bg);border-radius:999px;padding:10px 18px;font-weight:700;font-size:.9rem;animation:rise .3s ease-out}
input[type=file]{position:fixed;left:-9999px;width:1px;height:1px;opacity:0}

@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes unveil{from{filter:blur(11px);opacity:.4}to{filter:none;opacity:1}}
@keyframes popin{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:none}}
@keyframes bump{40%{transform:scale(1.15)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top" id="top"></header>
<main id="main"></main>
<div class="cta" id="cta"></div>
<nav class="tabs" id="tabs" aria-label="Navigation"></nav>
<input type="file" id="file" accept="image/*">
<div id="layer"></div>

<script>
/* ---------- Données ---------- */
var STEPS=[
 {id:'lalitta',day:1,when:'Jeudi 15 · 9h30',
  riddle:"Une forêt de légende, des ponts de pierre et de l'eau qui tombe de partout. Ici, le ticket d'entrée se boit.",
  hint:"Premier arrêt, à 15 minutes de Chiang Rai. On y prend le petit-déjeuner.",
  place:'Lalitta Café',about:"Un café-jardin inspiré de la forêt mythique d'Himmapan. L'entrée de 60 ฿ est convertie en boisson.",
  mission:'Vous deux devant une cascade.',maps:'https://www.google.com/maps/search/?api=1&query=Lalitta+Caf%C3%A9+Rim+Kok+Chiang+Rai'},
 {id:'patueng',day:1,when:'Jeudi 15 · 11h45',
  riddle:"La terre souffle de la vapeur et crache de l'eau à dix mètres de haut. On y trempe les pieds, et certains y cuisent leurs œufs.",
  hint:"Sur la route plate avant la montée, près de Mae Chan. Ça sent un peu le soufre.",
  place:'Pa Tueng Hot Springs',about:"Un geyser dans un petit parc, et des bassins gratuits où les habitants trempent leurs pieds.",
  mission:'Vos quatre pieds dans le même bassin.',maps:'https://www.google.com/maps/search/?api=1&query=Pa+Tueng+Hot+Springs&query_place_id=ChIJG_i8gDr81jAROG8mZbGQzWU'},
 {id:'xinshidai',day:1,when:'Jeudi 15 · 13h30',
  riddle:"Une boulangerie de plus de 50 ans perchée au milieu des théiers. Tout est fait au vrai beurre, et il faut garder de la place pour un roulé.",
  hint:"Après 30 minutes de montée raide. Le déjeuner du premier jour.",
  place:'Xin Shi Dai Bakery',about:"Une boulangerie-café familiale de Mae Salong, en contrebas de la rue principale. Pizza yunnanaise, tempura, onion rings.",
  mission:'Le roulé à la vanille, juste avant la première bouchée.',maps:'https://www.google.com/maps/search/?api=1&query=Xin+Shi+Dai+Bakery&query_place_id=ChIJS9MTd03h1jARpEt43s_AlXI'},
 {id:'maesalong',day:1,when:'Jeudi 15 · 15h30',
  riddle:"Des soldats chinois sont montés ici après 1949. Leurs enfants ont remplacé le pavot par une feuille qu'on sert dans des tasses minuscules, et la dégustation est gratuite.",
  hint:"Le village où on dort ce soir. Un musée, un tombeau de général, et une rue entière de maisons de thé.",
  place:'Le village de Mae Salong',about:"Le musée des Martyrs chinois, le tombeau du général Tuan et la rue des maisons de thé, où l'oolong se goûte sans obligation d'achat.",
  mission:"Trinquez avec deux tasses d'oolong.",maps:'https://www.google.com/maps/search/?api=1&query=Chinese+Martyrs+Memorial+Museum+Mae+Salong'},

/* ---------- État ---------- */
var KEY='chasse-ugo-v1';
function fresh(){return {revealed:{},hint:{},guessed:{},done:{},skipped:{},photo:{},opened:{},started:false,installSeen:false};}
var S=fresh();
try{var raw=localStorage.getItem(KEY);if(raw)S=Object.assign(fresh(),JSON.parse(raw));}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
var V={tab:'hunt',focus:null,confirmSkip:false,confirmReset:false,saving:null,error:null};

/* ---------- Photos (IndexedDB, restent sur le téléphone) ---------- */
var dbp=null;
function idb(){if(dbp)return dbp;dbp=new Promise(function(res,rej){
  if(!window.indexedDB)return rej('no idb');var r=indexedDB.open('chasse-ugo',1);
  r.onupgradeneeded=function(){r.result.createObjectStore('photos');};
  r.onsuccess=function(){res(r.result);};r.onerror=function(){rej(r.error);};});return dbp;}
function putPhoto(id,blob){return idb().then(function(db){return new Promise(function(res,rej){
  var t=db.transaction('photos','readwrite');t.objectStore('photos').put(blob,id);t.oncomplete=res;t.onerror=function(){rej(t.error);};});});}
function getPhoto(id){return idb().then(function(db){return new Promise(function(res){
  var q=db.transaction('photos').objectStore('photos').get(id);q.onsuccess=function(){res(q.result||null);};q.onerror=function(){res(null);};});}).catch(function(){return null;});}
function clearPhotos(){return idb().then(function(db){return new Promise(function(res){
  var t=db.transaction('photos','readwrite');t.objectStore('photos').clear();t.oncomplete=res;t.onerror=res;});}).catch(function(){});}
var urls={};
function photoUrl(id){if(urls[id])return Promise.resolve(urls[id]);
  return getPhoto(id).then(function(b){if(!b)return null;urls[id]=URL.createObjectURL(b);return urls[id];});}
/* remplit les <img data-photo="id"> après chaque rendu */
function hydrate(root){root.querySelectorAll('img[data-photo]').forEach(function(im){
  photoUrl(im.getAttribute('data-photo')).then(function(u){if(u)im.src=u;});});}
function loadImage(file){
  if(window.createImageBitmap)return createImageBitmap(file,{imageOrientation:'from-image'}).catch(function(){return viaImg(file);});
  return viaImg(file);}
function viaImg(file){return new Promise(function(res,rej){var im=new Image();im.onload=function(){res(im);};im.onerror=rej;im.src=URL.createObjectURL(file);});}
function compress(file){return loadImage(file).then(function(img){
  var w=img.width,h=img.height,s=Math.min(1,1600/Math.max(w,h));
  var c=document.createElement('canvas');c.width=Math.round(w*s);c.height=Math.round(h*s);
  c.getContext('2d').drawImage(img,0,0,c.width,c.height);
  return new Promise(function(res){c.toBlob(function(b){res(b||file);},'image/jpeg',0.85);});
}).catch(function(){return file;});}

/* ---------- Calculs ---------- */
function settled(id){return !!(S.done[id]||S.skipped[id]);}
function currentIndex(){for(var i=0;i<STEPS.length;i++)if(!settled(STEPS[i].id))return i;return -1;}
function stepPoints(id){return (S.done[id]?10:0)+(S.done[id]&&S.photo[id]?5:0)+(S.guessed[id]===true?5:0);}
function points(){return STEPS.reduce(function(p,s){return p+stepPoints(s.id);},0);}
function rank(p){var r=RANKS[0][1];RANKS.forEach(function(x){if(p>=x[0])r=x[1];});return r;}
function unlocked(i){var s=STEPS[i];return settled(s.id)||i===currentIndex()||!!S.opened[s.id];}
function focusIndex(){var c=currentIndex();if(V.focus===null)return c<0?-1:c;return V.focus;}
function photoCount(){return STEPS.filter(function(s){return S.photo[s.id];}).length;}
function doneCount(){return STEPS.filter(function(s){return S.done[s.id];}).length;}

/* ---------- Rendu ---------- */
var $=function(id){return document.getElementById(id);};
function render(){renderTop();renderMain();renderCta();renderTabs();}

function renderTop(){
  var fi=focusIndex(),cur=currentIndex(),title;
  if(V.tab==='hunt')title=fi<0?'Trésor trouvé':'Étape '+(fi+1)+' <small>/ '+STEPS.length+'</small>';
  else if(V.tab==='route')title='Le parcours';else title="L'album";
  var seg=STEPS.map(function(s,i){var c=S.done[s.id]?'done':S.skipped[s.id]?'skip':(V.tab==='hunt'&&i===fi)?'here':'';
    return '<i class="'+c+'" style="--c:'+DAYCOLOR[s.day]+'"></i>';}).join('');
  $('top').innerHTML='<div class="bar"><span class="title">'+title+'</span><span class="score" id="score" aria-label="'+points()+' points"><span class="star">'+ic('star')+'</span>'+points()+'</span></div><div class="seg" aria-hidden="true">'+seg+'</div>';
}

function renderTabs(){
  var t=[['hunt','compass','Chasse'],['route','route','Parcours'],['album','photos','Album']];
  var n=photoCount();
  $('tabs').innerHTML=t.map(function(x){return '<button data-act="tab" data-tab="'+x[0]+'"'+(V.tab===x[0]?' aria-current="page"':'')+'><span class="ic">'+ic(x[1])+
    (x[0]==='album'&&n?'<span class="badge">'+n+'</span>':'')+'</span>'+x[2]+'</button>';}).join('');
}

function renderMain(){
  var m=$('main');
  if(V.tab==='route')m.innerHTML=routeView();
  else if(V.tab==='album')m.innerHTML=albumView();
  else m.innerHTML=huntView();
  hydrate(m);
}

function huntView(){
  var i=focusIndex();
  if(i<0)return finaleView();
  var s=STEPS[i],c=DAYCOLOR[s.day],h='';
  var nav='<div class="nav"><button data-act="prev"'+(i===0?' disabled':'')+'>'+ic('left')+'Précédente</button><button data-act="next"'+(i===STEPS.length-1?' disabled':'')+'>Suivante'+ic('right')+'</button></div>';
  if(!unlocked(i)){
    return '<section class="card" style="--c:'+c+'"><span class="when"><span class="dot"></span>'+esc(s.when)+'</span>'+
      '<div class="locked"><span class="lock">'+ic('lock')+'</span><h2>Étape mystère</h2><p>Elle s\'ouvre quand la précédente est validée. Si le programme change sur place, tu peux l\'ouvrir maintenant.</p>'+
      '<button class="chipbtn" data-act="unlock">'+ic('eye')+'L\'ouvrir maintenant</button></div></section>'+nav;
  }
  var rev=!!S.revealed[s.id];
  h+='<section class="card" style="--c:'+c+'">';
  h+='<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px"><span class="when"><span class="dot"></span>'+esc(s.when)+'</span><span class="num">'+String(i+1).padStart(2,'0')+'</span></div>';
  h+='<p class="riddle">'+esc(s.riddle)+'</p>';
  if(!rev){
    h+=S.hint[s.id]?'<p class="hint">'+ic('bulb')+'<span>'+esc(s.hint)+'</span></p>':'<div><button class="chipbtn" data-act="hint">'+ic('bulb')+'Un indice</button></div>';
    h+='<div class="place veiled" aria-hidden="true"><span class="lbl">Le lieu</span><h2>'+esc(s.place)+'</h2><p>'+esc(s.about)+'</p></div>';
  }else{
    h+='<div class="place shown"><span class="lbl">Le lieu</span><h2>'+esc(s.place)+'</h2><p>'+esc(s.about)+'</p></div>';
    h+='<div class="links"><a class="chipbtn" href="'+esc(s.maps)+'" target="_blank" rel="noopener">'+ic('pin')+'Ouvrir dans Maps</a></div>';
    if(S.guessed[s.id]===undefined){
      h+='<div class="guess"><b>Tu avais trouvé avant de révéler ?</b><div class="two"><button class="yes" data-act="guess" data-v="1">Oui · +5</button><button data-act="guess" data-v="0">Non</button></div></div>';
    }else{
      h+='<p class="guessed">'+(S.guessed[s.id]?'Trouvé tout seul · +5':'Pas trouvé cette fois')+'</p>';
    }
    h+='<div class="mission"><span class="lbl">'+ic('cam')+'Défi photo · +5</span><p>'+esc(s.mission)+'</p>';
    if(S.photo[s.id]){
      h+='<div class="pic"><img data-photo="'+s.id+'" alt="Votre photo : '+esc(s.place)+'" data-act="view" data-id="'+s.id+'"><button data-act="photo">'+ic('swap')+'Changer</button></div>';
    }else{
      h+='<button class="shot" data-act="photo">'+ic('cam')+'<span>Prendre ou choisir la photo<small>Appareil photo ou galerie</small></span></button>';
    }
    if(V.saving===s.id)h+='<p class="saving">Enregistrement de la photo…</p>';
    if(V.error)h+='<p class="err">'+esc(V.error)+'</p>';
    h+='</div>';
  }
  if(!settled(s.id)){
    if(V.confirmSkip){
      h+='<div class="confirm"><b>Passer cette étape ?</b><span>Elle ne rapporte pas de points. Tu pourras y revenir depuis le parcours.</span><div class="two"><button class="danger" data-act="skip">Passer</button><button data-act="noskip">Annuler</button></div></div>';
    }else h+='<div class="minor"><button data-act="askskip">Le programme a changé ? Passer cette étape</button></div>';
  }else if(S.skipped[s.id]){
    h+='<p class="guessed">Étape passée. Tu peux encore la valider.</p>';
  }
  h+='</section>'+nav;
  return h;
}

function finaleView(){
  return '<section class="treasure"><span class="when" style="color:inherit;opacity:.7;justify-content:center">Boucle bouclée</span><h2>Trésor trouvé</h2>'+
    '<p>'+points()+' points sur '+MAX+' · '+esc(rank(points()))+'</p><p>Le trésor, c\'est l\'album : 4 jours, 400 km, et nous deux sur chaque photo.</p><p class="sign">Lison</p></section>'+
    '<div class="stats" style="margin-top:12px">'+stats()+'</div>';
}
function stats(){var g=STEPS.filter(function(s){return S.guessed[s.id]===true;}).length;
  return '<div class="stat"><b>'+doneCount()+'</b><span>étapes</span></div><div class="stat"><b>'+photoCount()+'</b><span>photos</span></div><div class="stat"><b>'+g+'</b><span>trouvées seul</span></div>';}

function routeView(){
  var cur=currentIndex(),h='<div class="hero"><h1>La chasse <em>d\'Ugo</em></h1><div class="stats">'+stats()+'</div></div>';
  [1,2,3,4].forEach(function(d){
    var idx=[];STEPS.forEach(function(s,i){if(s.day===d)idx.push(i);});
    var dn=idx.filter(function(i){return settled(STEPS[i].id);}).length;
    h+='<div class="dayh" style="--c:'+DAYCOLOR[d]+'"><span class="dot"></span><h2>'+DAYS[d]+'</h2><small>'+dn+' / '+idx.length+'</small></div>';
    h+='<p style="margin:-6px 4px 10px;color:var(--muted);font-size:.88rem;font-weight:600">'+DAYNAME[d]+'</p><ol class="list">';
    idx.forEach(function(i){var s=STEPS[i],u=unlocked(i),done=!!S.done[s.id];
      var name=(u&&S.revealed[s.id])?s.place:(u?'Énigme à résoudre':'Étape mystère');
      var cls='row'+(done?' done':'')+(i===cur?' here':'')+(u?'':' lock');
      h+='<li><button class="'+cls+'" style="--c:'+DAYCOLOR[s.day]+'" data-act="goto" data-i="'+i+'"><span class="b">'+(done?ic('check'):(u?i+1:ic('lock')))+'</span>'+
        '<span class="t"><b>'+esc(name)+'</b><span>'+esc(s.when.split(' · ')[1])+(S.skipped[s.id]?' · passée':'')+(i===cur?' · en cours':'')+'</span></span>'+
        (S.photo[s.id]?'<img data-photo="'+s.id+'" alt="">':'<span class="go">'+ic('right')+'</span>')+'</button></li>';});
    h+='</ol>';
  });
  h+='<div class="minor" style="margin-top:24px">'+(V.confirmReset?'':'<button data-act="askreset">Recommencer la chasse</button>')+'</div>';
  if(V.confirmReset)h+='<div class="confirm"><b>Tout effacer ?</b><span>Points et photos de l\'appli seront supprimés. Les photos déjà enregistrées dans ton téléphone ne sont pas touchées.</span><div class="two"><button class="danger" data-act="reset">Tout effacer</button><button data-act="noreset">Annuler</button></div></div>';
  return h;
}

function albumView(){
  var ps=STEPS.filter(function(s){return S.photo[s.id];});
  if(!ps.length)return '<div class="empty">'+ic('photos')+'<b>Pas encore de photo</b><span>Chaque défi photo relevé arrive ici.</span></div>';
  var h='<div class="hero"><h1>Nos <em>photos</em></h1><p style="color:var(--muted);font-weight:600">'+ps.length+' photo'+(ps.length>1?'s':'')+' · touche une photo pour l\'agrandir</p></div><div class="grid">';
  ps.forEach(function(s){h+='<button data-act="view" data-id="'+s.id+'"><img data-photo="'+s.id+'" alt="'+esc(s.place)+'" loading="lazy"><span class="cap">'+esc(s.place)+'</span></button>';});
  return h+'</div>';
}

function renderCta(){
  var c=$('cta'),h='';
  if(V.tab==='album'){
    h=photoCount()?'<button class="primary alt" data-act="shareall">'+ic('share')+'<span>Partager toutes les photos</span></button>':'';
  }else if(V.tab==='route'){
    var cur=currentIndex();
    h=cur<0?'':'<button class="primary" data-act="resume">'+ic('compass')+'<span>Reprendre l\'étape '+(cur+1)+'</span></button>';
  }else{
    var i=focusIndex();
    if(i<0){h='<button class="primary" data-act="tab" data-tab="album">'+ic('gift')+'<span>Voir l\'album</span></button>';}
    else{var s=STEPS[i];
      if(!unlocked(i))h='<button class="primary alt" data-act="resume">'+ic('compass')+'<span>Revenir à l\'étape en cours</span></button>';
      else if(!S.revealed[s.id])h='<button class="primary" id="hold" data-act="hold" aria-label="Maintenir pour révéler le lieu"><span class="fill"></span>'+ic('eye')+'<span>Maintenir pour révéler</span></button>';
      else if(!S.done[s.id])h=S.photo[s.id]
        ?'<button class="primary" data-act="validate">'+ic('check')+'<span>Valider l\'étape</span><span class="pts">+'+(10+5+(S.guessed[s.id]===true?5:0))+'</span></button>'
        :'<button class="primary" data-act="photo">'+ic('cam')+'<span>Prendre la photo</span></button>';
      else{var cur2=currentIndex();
        h=cur2<0?'<button class="primary" data-act="resume">'+ic('gift')+'<span>Voir le trésor</span></button>'
          :(cur2===i?'':'<button class="primary alt" data-act="resume">'+ic('arrow')+'<span>'+(cur2>i?'Aller à l\'étape '+(cur2+1):'Revenir à l\'étape '+(cur2+1))+'</span></button>');}
    }
  }
  c.innerHTML=h?'<div class="in">'+h+'</div>':'';c.hidden=!h;
  // petite validation sans photo, sous le bouton principal
  if(V.tab==='hunt'){var i2=focusIndex();if(i2>=0){var s2=STEPS[i2];
    if(unlocked(i2)&&S.revealed[s2.id]&&!S.done[s2.id]&&!S.photo[s2.id]){
      c.querySelector('.in').insertAdjacentHTML('beforeend','<div class="minor" style="padding-top:2px"><button data-act="validate" style="min-height:36px">Valider sans photo (+10)</button></div>');}}}
  bindHold();
}

/* ---------- Appui long pour révéler ---------- */
function bindHold(){
  var b=$('hold');if(!b)return;var t0=0,raf=0,dur=900;
  function stop(){cancelAnimationFrame(raf);raf=0;b.style.setProperty('--p',0);}
  function tick(){var p=Math.min(1,(performance.now()-t0)/dur);b.style.setProperty('--p',p);
    if(p>=1){raf=0;buzz(30);reveal();return;}raf=requestAnimationFrame(tick);}
  b.addEventListener('pointerdown',function(e){e.preventDefault();t0=performance.now();buzz(8);raf=requestAnimationFrame(tick);});
  ['pointerup','pointerleave','pointercancel'].forEach(function(ev){b.addEventListener(ev,function(){if(raf)stop();});});
  b.addEventListener('contextmenu',function(e){e.preventDefault();});
  b.addEventListener('click',function(e){if(e.detail===0)reveal();}); // clavier, lecteur d'écran
}
function reveal(){var s=STEPS[focusIndex()];S.revealed[s.id]=true;save();render();}
function buzz(ms){try{navigator.vibrate&&navigator.vibrate(ms);}catch(e){}}

/* ---------- Actions ---------- */
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b)return;var a=b.getAttribute('data-act');
  var i=focusIndex(),s=i>=0?STEPS[i]:null;
  switch(a){
    case 'tab':V.tab=b.getAttribute('data-tab');V.confirmReset=false;render();scrollTo(0,0);break;
    case 'hint':S.hint[s.id]=true;save();render();break;
    case 'guess':S.guessed[s.id]=b.getAttribute('data-v')==='1';save();render();if(S.guessed[s.id])bump();break;
    case 'photo':pickFor=s.id;$('file').value='';$('file').click();break;
    case 'validate':validate(i);break;
    case 'askskip':V.confirmSkip=true;render();break;
    case 'noskip':V.confirmSkip=false;render();break;
    case 'skip':S.skipped[s.id]=true;save();V.confirmSkip=false;V.focus=null;render();scrollTo(0,0);toast('Étape passée');break;
    case 'unlock':S.opened[s.id]=true;save();render();break;
    case 'prev':V.focus=Math.max(0,i-1);V.confirmSkip=false;render();scrollTo(0,0);break;
    case 'next':V.focus=Math.min(STEPS.length-1,i+1);V.confirmSkip=false;render();scrollTo(0,0);break;
    case 'resume':V.tab='hunt';V.focus=null;render();scrollTo(0,0);break;
    case 'goto':V.tab='hunt';V.focus=+b.getAttribute('data-i');V.confirmSkip=false;render();scrollTo(0,0);break;
    case 'view':openViewer(b.getAttribute('data-id'));break;
    case 'shareall':shareAll();break;
    case 'askreset':V.confirmReset=true;render();break;
    case 'noreset':V.confirmReset=false;render();break;
    case 'reset':var keep={started:true,installSeen:S.installSeen};S=Object.assign(fresh(),keep);save();clearPhotos().then(function(){urls={};V={tab:'hunt',focus:null};render();toast('Chasse remise à zéro');});break;
  }
});

var pickFor=null;
$('file').addEventListener('change',function(){
  var f=this.files&&this.files[0],id=pickFor;if(!f||!id)return;
  V.saving=id;V.error=null;render();
  compress(f).then(function(blob){return putPhoto(id,blob);}).then(function(){
    if(urls[id]){URL.revokeObjectURL(urls[id]);delete urls[id];}
    S.photo[id]=true;save();V.saving=null;buzz(15);render();
  }).catch(function(){V.saving=null;V.error="La photo n'a pas pu être enregistrée. La mémoire du téléphone est peut-être pleine : réessaie avec une autre photo.";render();});
});

function validate(i){
  var s=STEPS[i],before=rank(points());
  S.done[s.id]=Date.now();delete S.skipped[s.id];save();
  var gain=stepPoints(s.id),after=rank(points());
  V.focus=null;V.confirmSkip=false;render();scrollTo(0,0);bump();buzz([20,40,20]);
  celebrate(s,gain,before!==after?after:null);
}
function bump(){var e=$('score');if(e){e.classList.remove('bump');void e.offsetWidth;e.classList.add('bump');}}
function toast(t){var d=document.createElement('div');d.className='toast';d.textContent=t;$('layer').appendChild(d);setTimeout(function(){d.remove();},1800);}

/* ---------- Fête ---------- */
function celebrate(s,gain,newRank){
  var last=currentIndex()<0;
  var box=document.createElement('div');box.className='party';box.style.setProperty('--c',DAYCOLOR[s.day]);
  box.innerHTML='<canvas></canvas><div class="box" role="dialog" aria-modal="true" aria-label="Étape validée"><span class="ok">'+ic('check')+'</span>'+
    '<h2>'+esc(s.place)+'</h2><span class="gain">+'+gain+'</span>'+(newRank?'<span class="rk">Nouveau grade : '+esc(newRank)+'</span>':'<span class="rk">'+esc(rank(points()))+'</span>')+
    '<button class="primary" data-close>'+(last?ic('gift')+'<span>Découvrir le trésor</span>':ic('arrow')+'<span>Énigme suivante</span>')+'</button></div>';
  $('layer').appendChild(box);
  box.querySelector('[data-close]').addEventListener('click',function(){box.remove();});
  box.querySelector('[data-close]').focus();
  confetti(box.querySelector('canvas'));
}
function confetti(cv){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  var dpr=Math.min(2,devicePixelRatio||1),W=innerWidth,H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;
  var x=cv.getContext('2d');x.scale(dpr,dpr);
  var cs=getComputedStyle(document.documentElement),cols=['--d1','--d2','--d3','--d4','--gold','--accent'].map(function(v){return cs.getPropertyValue(v).trim();});
  var P=[];for(var k=0;k<120;k++)P.push({x:W/2,y:H*.42,vx:(Math.random()-.5)*11,vy:-Math.random()*13-4,r:Math.random()*6+4,a:Math.random()*6,va:(Math.random()-.5)*.3,c:cols[k%cols.length]});
  var t0=performance.now();
  (function f(t){x.clearRect(0,0,W,H);var alive=t-t0<2600;
    P.forEach(function(p){p.vy+=.32;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.a+=p.va;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);x.restore();});
    if(alive&&cv.isConnected)requestAnimationFrame(f);else x.clearRect(0,0,W,H);})(t0);
}

/* ---------- Visionneuse ---------- */
function openViewer(id){
  var list=STEPS.filter(function(s){return S.photo[s.id];}),k=list.findIndex(function(s){return s.id===id;});if(k<0)return;
  var v=document.createElement('div');v.className='viewer';v.setAttribute('role','dialog');v.setAttribute('aria-modal','true');
  function draw(){var s=list[k];
    v.innerHTML='<div class="vt"><span style="font-weight:700;font-size:.9rem;opacity:.8">'+(k+1)+' / '+list.length+'</span><button data-v="close" aria-label="Fermer">'+ic('x')+'</button></div>'+
      '<div class="stage"><img data-photo="'+s.id+'" alt="'+esc(s.place)+'"></div>'+
      '<div class="vb"><div><b>'+esc(s.place)+'</b><br><span>'+esc(s.when)+' · appui long pour l\'enregistrer</span></div><div class="acts">'+
      '<button data-v="prev" aria-label="Photo précédente"'+(k===0?' disabled style="opacity:.3"':'')+'>'+ic('left')+'</button>'+
      '<button data-v="share">'+ic('share')+'Partager</button>'+
      '<button data-v="next" aria-label="Photo suivante"'+(k===list.length-1?' disabled style="opacity:.3"':'')+'>'+ic('right')+'</button></div></div>';
    hydrate(v);}
  v.addEventListener('click',function(e){var b=e.target.closest('[data-v]');if(!b)return;var a=b.getAttribute('data-v');
    if(a==='close')v.remove();else if(a==='prev'&&k>0){k--;draw();}else if(a==='next'&&k<list.length-1){k++;draw();}else if(a==='share')shareFiles([list[k]]);});
  var sx=null;v.addEventListener('touchstart',function(e){sx=e.touches[0].clientX;},{passive:true});
  v.addEventListener('touchend',function(e){if(sx===null)return;var dx=e.changedTouches[0].clientX-sx;sx=null;
    if(dx<-50&&k<list.length-1){k++;draw();}else if(dx>50&&k>0){k--;draw();}});
  draw();$('layer').appendChild(v);
}

/* ---------- Partage ---------- */
function shareAll(){shareFiles(STEPS.filter(function(s){return S.photo[s.id];}));}
function shareFiles(list){
  Promise.all(list.map(function(s){return getPhoto(s.id).then(function(b){
    var n=STEPS.indexOf(s)+1;return b?new File([b],String(n).padStart(2,'0')+'-'+s.id+'.jpg',{type:'image/jpeg'}):null;});}))
  .then(function(files){files=files.filter(Boolean);
    if(navigator.canShare&&navigator.canShare({files:files}))return navigator.share({files:files,title:'Boucle du Nord'});
    toast("Partage indisponible ici : ouvre la photo et appuie longuement dessus");})
  .catch(function(e){if(!e||e.name!=='AbortError')toast("Le partage n'a pas abouti");});
}

/* ---------- Accueil et installation ---------- */
function welcome(){
  var w=document.createElement('div');w.className='welcome';
  w.innerHTML='<span class="k">Boucle du Nord · 15 → 18 octobre</span><h1>La chasse<em>d\'Ugo</em></h1>'+
    '<p style="font-size:1.05rem">16 étapes, 4 jours de scooter, et une énigme à chaque arrêt.</p>'+
    '<ul class="rules"><li><span class="ri">'+ic('bulb')+'</span>Lis l\'énigme et devine où on va</li>'+
    '<li><span class="ri">'+ic('eye')+'</span>Maintiens le bouton pour révéler le lieu</li>'+
    '<li><span class="ri">'+ic('cam')+'</span>Relève le défi avec une photo de nous deux</li>'+
    '<li><span class="ri">'+ic('star')+'</span>Gagne jusqu\'à 20 points par étape</li></ul>'+
    '<p class="sign" style="color:var(--accent);font-size:1.1rem">Lison</p>'+
    '<button class="primary" data-start>'+ic('compass')+'<span>C\'est parti</span></button>';
  document.body.appendChild(w);
  w.querySelector('[data-start]').addEventListener('click',function(){S.started=true;save();w.remove();installSheet();});
}
function installSheet(){
  var standalone=(window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||navigator.standalone===true;
  if(standalone||S.installSeen)return;
  var d=document.createElement('div');d.className='sheet';d.setAttribute('role','dialog');
  d.innerHTML='<b>À faire une fois, avec du réseau</b><p>Dans Safari : bouton Partager, puis « Sur l\'écran d\'accueil ». Ouvre ensuite la chasse toujours depuis l\'icône : elle marche sans connexion et garde les photos.</p><button>Compris</button>';
  $('layer').appendChild(d);
  d.querySelector('button').addEventListener('click',function(){S.installSeen=true;save();d.remove();});
}

if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(function(){});
render();
if(!S.started)welcome();else installSheet();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(function(){});
</script>
